# NGINX Configuration for Abzal Uteshov Landing Page
# Performance Optimization: Cache Headers & Compression

# =====================================================
# GZIP COMPRESSION
# =====================================================
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml+rss
  application/rss+xml
  font/truetype
  font/opentype
  application/vnd.ms-fontobject
  image/svg+xml;
gzip_disable "msie6";

# =====================================================
# CACHE HEADERS BY FILE TYPE
# =====================================================

# HTML: Always revalidate with server (no cache)
location ~ \.html?$ {
  add_header Cache-Control "no-cache, must-revalidate, max-age=0";
  add_header Pragma "no-cache";
  add_header Expires "0";
}

# Assets (CSS, JS, Fonts, Images): Long-term cache (1 year)
location ~* \.(css|js|woff|woff2|ttf|otf|eot|svg)$ {
  expires 1y;
  add_header Cache-Control "public, immutable, max-age=31536000";
  access_log off;
}

# Images (WebP, JPEG, PNG, GIF): Long-term cache (1 year)
location ~* \.(webp|jpg|jpeg|png|gif|ico)$ {
  expires 1y;
  add_header Cache-Control "public, immutable, max-age=31536000";
  access_log off;
}

# OG Cover Image: Medium cache (1 day)
# Used only for social sharing, update frequently
location ~* og-cover\.(jpg|jpeg|png)$ {
  expires 1d;
  add_header Cache-Control "public, max-age=86400";
  access_log off;
}

# =====================================================
# SECURITY & OPTIMIZATION
# =====================================================

# Enable ETag
etag on;

# Add security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Remove server version
server_tokens off;

# =====================================================
# PERFORMANCE HINTS
# =====================================================

# Enable HTTP/2 (if using HTTPS)
listen 443 ssl http2;

# Preload critical assets in browser
add_header Link '</assets/css/style.css>; rel=preload; as=style' always;
add_header Link '</assets/js/main.js>; rel=preload; as=script' always;
